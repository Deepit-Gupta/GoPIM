[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gopim-simulator"
version = "0.1.0"
description = "Software reference simulator for GOPIM graph-processing-in-memory workloads"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
ogb = [
    "ogb>=1.3.6",
    "torch-geometric>=2.4",
]

[project.scripts]
gopim = "gopim.cli:main"

[tool.setuptools.packages.find]
include = ["gopim*"]
